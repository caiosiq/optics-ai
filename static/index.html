<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Optics Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">AI Optics Agent</div>
        <div id="modelTag" class="tag" style="margin:0">model: not set</div>
      </div>
      <div id="contextBar" class="context-bar" style="display:none"></div>
      <div class="chat glass">
        <div id="messages"></div>
        <div class="controls">
          <input id="input" type="text" placeholder="Type message" />
          <button id="send">Send</button>
          <button id="test">Test JSON Parse</button>
        </div>
      </div>
    </div>
    <div id="modal" class="modal">
      <div class="modal-card">
        <div class="title" style="margin-bottom:8px">Select Model</div>
        <select id="modelSelect">
          <option value="openai/gpt-4.1-mini">GPT-4.1 Mini</option>
          <option value="openai/gpt-4.1">GPT-4.1</option>
          <option value="openai/gpt-5">GPT-5</option>
        </select>
        <div class="controls" style="margin-top:12px">
          <button id="startChat">Start Chat</button>
        </div>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
